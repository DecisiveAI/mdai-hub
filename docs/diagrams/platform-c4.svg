<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">SmartHub C4 Container View</title>
  <desc id="desc">SmartHub architecture organized into readable columns: entry points, deployment and control, telemetry runtime, events and state, data stores, and external dependencies.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <marker id="softArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .cluster { fill: #f1f5f9; stroke: #64748b; stroke-width: 2.2; stroke-dasharray: 10 8; }
      .boundary { fill: #ecfdf5; stroke: #15803d; stroke-width: 2; }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .person { fill: #ffffff; stroke: #0f766e; stroke-width: 2; }
      .source { fill: #e0f2fe; stroke: #0369a1; stroke-width: 1.6; }
      .built { fill: #0f766e; stroke: #064e3b; stroke-width: 1.5; }
      .runtime { fill: #16a34a; stroke: #14532d; stroke-width: 1.5; }
      .data { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.5; }
      .external { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; }
      .solution { fill: #fae8ff; stroke: #a21caf; stroke-width: 1.5; }
      .title { font: 700 32px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 15px Arial, sans-serif; fill: #475569; }
      .section { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .note { font: 13px Arial, sans-serif; fill: #475569; }
      .label { font: 700 15px Arial, sans-serif; fill: #ffffff; }
      .dark-label { font: 700 15px Arial, sans-serif; fill: #0f172a; }
      .small { font: 12.5px Arial, sans-serif; fill: #ffffff; }
      .dark-small { font: 12.5px Arial, sans-serif; fill: #334155; }
      .edge { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#softArrow); stroke-dasharray: 5 4; }
      .edge-label { font: 11.5px Arial, sans-serif; fill: #334155; paint-order: stroke; stroke: #f8fafc; stroke-width: 4; }
      .legend { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.3; }
    </style>
  </defs>

  <rect class="bg" width="100%" height="100%"/>
  <text class="title" x="56" y="58">SmartHub C4 Container View</text>
  <text class="subtitle" x="56" y="86">Readable platform view with wider spacing, grouped responsibilities, and routed connector lanes.</text>

  <rect class="cluster" x="350" y="120" width="890" height="820" rx="24"/>
  <text class="section" x="795" y="154" text-anchor="middle">Kubernetes cluster boundary</text>
  <text class="note" x="795" y="178" text-anchor="middle">SmartHub runtime containers, collectors, validation, data stores, and dependencies run together in the target cluster.</text>

  <rect class="boundary" x="390" y="220" width="810" height="680" rx="18"/>
  <text class="section" x="795" y="252" text-anchor="middle">MyDecisive SmartHub platform boundary</text>
  <text class="note" x="795" y="276" text-anchor="middle">Platform services install telemetry resources, process events, mutate runtime state, and export telemetry.</text>

  <rect class="lane" x="420" y="315" width="210" height="535" rx="14"/>
  <text class="dark-label" x="525" y="345" text-anchor="middle">Deployment and control</text>
  <text class="dark-small" x="525" y="365" text-anchor="middle">Chart, CRDs, variables, xDS.</text>

  <rect class="lane" x="690" y="315" width="210" height="535" rx="14"/>
  <text class="dark-label" x="795" y="345" text-anchor="middle">Telemetry runtime</text>
  <text class="dark-small" x="795" y="365" text-anchor="middle">Collectors, validation, insight.</text>

  <rect class="lane" x="960" y="315" width="210" height="535" rx="14"/>
  <text class="dark-label" x="1065" y="345" text-anchor="middle">Events and state</text>
  <text class="dark-small" x="1065" y="365" text-anchor="middle">Gateway, event hub, Valkey.</text>

  <circle class="person" cx="115" cy="270" r="20"/>
  <line x1="115" y1="290" x2="115" y2="345" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
  <line x1="75" y1="310" x2="155" y2="310" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
  <line x1="115" y1="345" x2="85" y2="385" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
  <line x1="115" y1="345" x2="145" y2="385" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
  <text class="dark-label" x="115" y="418" text-anchor="middle">Operator</text>
  <text class="dark-small" x="115" y="439" text-anchor="middle">Platform or SRE user</text>

  <rect class="source" x="205" y="155" width="150" height="84" rx="10" filter="url(#shadow)"/>
  <text class="dark-label" x="280" y="187" text-anchor="middle">Octant</text>
  <text class="dark-small" x="280" y="211" text-anchor="middle">UI/API workflows</text>

  <rect class="source" x="205" y="300" width="150" height="84" rx="10" filter="url(#shadow)"/>
  <text class="dark-label" x="280" y="332" text-anchor="middle">Direct manifests</text>
  <text class="dark-small" x="280" y="356" text-anchor="middle">Kubernetes YAML</text>

  <rect class="source" x="205" y="445" width="150" height="84" rx="10" filter="url(#shadow)"/>
  <text class="dark-label" x="280" y="477" text-anchor="middle">mdai-cli</text>
  <text class="dark-small" x="280" y="501" text-anchor="middle">supported manifests</text>

  <rect class="solution" x="170" y="650" width="185" height="100" rx="10" filter="url(#shadow)"/>
  <text class="dark-label" x="262.5" y="682" text-anchor="middle">Solution manifests</text>
  <text class="dark-small" x="262.5" y="706" text-anchor="middle">PII, quota mode,</text>
  <text class="dark-small" x="262.5" y="725" text-anchor="middle">tail sampling, Octant</text>

  <rect class="source" x="455" y="405" width="140" height="90" rx="10" filter="url(#shadow)"/>
  <text class="dark-label" x="525" y="436" text-anchor="middle">mdai-hub</text>
  <text class="dark-small" x="525" y="459" text-anchor="middle">Umbrella Helm chart</text>
  <text class="dark-small" x="525" y="478" text-anchor="middle">for runtime install</text>

  <rect class="built" x="455" y="565" width="140" height="90" rx="10" filter="url(#shadow)"/>
  <text class="label" x="525" y="596" text-anchor="middle">mdai-operator</text>
  <text class="small" x="525" y="619" text-anchor="middle">CRDs, rules, variables,</text>
  <text class="small" x="525" y="638" text-anchor="middle">collectors, xDS</text>

  <rect class="runtime" x="455" y="730" width="140" height="75" rx="10" filter="url(#shadow)"/>
  <text class="label" x="525" y="760" text-anchor="middle">Envoy/xDS</text>
  <text class="small" x="525" y="783" text-anchor="middle">Runtime snapshots</text>

  <rect class="runtime" x="725" y="385" width="140" height="90" rx="10" filter="url(#shadow)"/>
  <text class="label" x="795" y="416" text-anchor="middle">OTel Collectors</text>
  <text class="small" x="795" y="439" text-anchor="middle">Receive, process, sample,</text>
  <text class="small" x="795" y="458" text-anchor="middle">and export telemetry</text>

  <rect class="runtime" x="725" y="545" width="140" height="90" rx="10" filter="url(#shadow)"/>
  <text class="label" x="795" y="576" text-anchor="middle">Validation</text>
  <text class="small" x="795" y="599" text-anchor="middle">Shadow traffic and</text>
  <text class="small" x="795" y="618" text-anchor="middle">fidelity checks</text>

  <path d="M725,710 C725,693 865,693 865,710 L865,760 C865,777 725,777 725,760 Z" class="data" filter="url(#shadow)"/>
  <ellipse cx="795" cy="710" rx="70" ry="17" class="data"/>
  <text class="dark-label" x="795" y="736" text-anchor="middle">Prometheus</text>
  <text class="dark-small" x="795" y="757" text-anchor="middle">metrics, alerts, health</text>

  <path d="M725,815 C725,798 865,798 865,815 L865,865 C865,882 725,882 725,865 Z" class="data" filter="url(#shadow)"/>
  <ellipse cx="795" cy="815" rx="70" ry="17" class="data"/>
  <text class="dark-label" x="795" y="841" text-anchor="middle">GreptimeDB</text>
  <text class="dark-small" x="795" y="862" text-anchor="middle">volume and cost insight</text>

  <rect class="built" x="995" y="385" width="140" height="90" rx="10" filter="url(#shadow)"/>
  <text class="label" x="1065" y="416" text-anchor="middle">mdai-gateway</text>
  <text class="small" x="1065" y="439" text-anchor="middle">API, Alertmanager,</text>
  <text class="small" x="1065" y="458" text-anchor="middle">event admission</text>

  <rect class="built" x="995" y="545" width="140" height="90" rx="10" filter="url(#shadow)"/>
  <text class="label" x="1065" y="576" text-anchor="middle">mdai-event-hub</text>
  <text class="small" x="1065" y="599" text-anchor="middle">MDAI event processing</text>
  <text class="small" x="1065" y="618" text-anchor="middle">over NATS and Valkey</text>

  <path d="M995,710 C995,693 1135,693 1135,710 L1135,760 C1135,777 995,777 995,760 Z" class="data" filter="url(#shadow)"/>
  <ellipse cx="1065" cy="710" rx="70" ry="17" class="data"/>
  <text class="dark-label" x="1065" y="736" text-anchor="middle">Valkey</text>
  <text class="dark-small" x="1065" y="757" text-anchor="middle">variables and state</text>

  <rect class="external" x="1340" y="240" width="180" height="80" rx="10" filter="url(#shadow)"/>
  <text class="dark-label" x="1430" y="272" text-anchor="middle">NATS/JetStream</text>
  <text class="dark-small" x="1430" y="295" text-anchor="middle">event transport</text>

  <rect class="external" x="1340" y="390" width="180" height="80" rx="10" filter="url(#shadow)"/>
  <text class="dark-label" x="1430" y="422" text-anchor="middle">OTel Operator</text>
  <text class="dark-small" x="1430" y="445" text-anchor="middle">collector CRDs</text>

  <rect class="external" x="1340" y="540" width="180" height="96" rx="10" filter="url(#shadow)"/>
  <text class="dark-label" x="1430" y="572" text-anchor="middle">kube-prometheus-stack</text>
  <text class="dark-small" x="1430" y="595" text-anchor="middle">Prometheus, Alertmanager,</text>
  <text class="dark-small" x="1430" y="614" text-anchor="middle">and Grafana</text>

  <rect class="external" x="1340" y="715" width="180" height="80" rx="10" filter="url(#shadow)"/>
  <text class="dark-label" x="1430" y="747" text-anchor="middle">Datadog</text>
  <text class="dark-small" x="1430" y="770" text-anchor="middle">external destination</text>

  <path class="edge" d="M155,310 L195,310"/>
  <text class="edge-label" x="174" y="296" text-anchor="middle">uses</text>

  <path class="edge" d="M355,197 C400,225 420,365 445,430"/>
  <path class="edge" d="M355,342 C395,360 420,410 445,440"/>
  <path class="edge" d="M355,487 C395,480 420,460 445,450"/>
  <text class="edge-label" x="405" y="398" text-anchor="middle">deploys chart</text>

  <path class="edge" d="M355,700 C405,690 425,625 445,610"/>
  <text class="edge-label" x="405" y="666" text-anchor="middle">templates</text>

  <path class="edge" d="M525,495 L525,555"/>
  <text class="edge-label" x="566" y="528" text-anchor="middle">installs</text>

  <path class="edge" d="M595,610 C650,585 675,450 715,430"/>
  <text class="edge-label" x="662" y="518" text-anchor="middle">reconciles</text>

  <path class="edge" d="M525,655 L525,720"/>
  <text class="edge-label" x="570" y="692" text-anchor="middle">xDS</text>

  <path class="edge" d="M865,430 L985,430"/>
  <text class="edge-label" x="925" y="418" text-anchor="middle">status/API</text>

  <path class="edge" d="M795,475 L795,535"/>
  <text class="edge-label" x="836" y="508" text-anchor="middle">validates</text>

  <path class="edge" d="M795,635 L795,693"/>
  <text class="edge-label" x="836" y="670" text-anchor="middle">metrics</text>

  <path class="edge" d="M865,450 C1035,520 1210,700 1330,755"/>
  <text class="edge-label" x="1115" y="702" text-anchor="middle">exports telemetry</text>

  <path class="edge" d="M865,465 C1010,500 1185,455 1330,430"/>
  <text class="edge-label" x="1110" y="474" text-anchor="middle">collector CRDs</text>

  <path class="edge" d="M1065,475 L1065,535"/>
  <text class="edge-label" x="1108" y="508" text-anchor="middle">events</text>

  <path class="edge" d="M1135,430 C1215,405 1260,295 1330,280"/>
  <path class="edge" d="M1135,590 C1215,540 1260,320 1330,280"/>
  <text class="edge-label" x="1248" y="352" text-anchor="middle">NATS</text>

  <path class="edge" d="M1135,430 C1215,445 1265,540 1330,588"/>
  <text class="edge-label" x="1248" y="545" text-anchor="middle">alerts</text>

  <path class="soft" d="M1065,635 L1065,693"/>
  <path class="soft" d="M995,735 L875,735"/>
  <path class="soft" d="M725,735 C655,720 610,675 595,640"/>
  <path class="soft" d="M865,735 L985,735"/>
  <text class="edge-label" x="930" y="792" text-anchor="middle">dashed paths: closed-loop state updates</text>

  <rect x="56" y="980" width="710" height="82" rx="10" class="legend"/>
  <text class="dark-label" x="78" y="1010">Closed-loop variable mutation</text>
  <text class="dark-small" x="78" y="1034">Alert events enter through mdai-gateway, are processed by mdai-event-hub, mutate</text>
  <text class="dark-small" x="78" y="1052">Valkey-backed variables, and return through reconciled collector runtime config.</text>

  <rect x="810" y="980" width="710" height="82" rx="10" class="legend"/>
  <text class="dark-label" x="832" y="1010">How to read this C4 view</text>
  <text class="dark-small" x="832" y="1034">Left column initiates deployment. Green SmartHub containers run platform behavior.</text>
  <text class="dark-small" x="832" y="1052">Orange stores and yellow dependencies support runtime operation.</text>
</svg>
