global:
  greptime:
#   use 'public' unless mentioned database is explicitly created in GreptimeDB
    databaseName: public
#   always use fullnameOverride
    fullnameOverride: &greptimeName mdai-greptimedb
    postgresPort: &postgresPort 4003
    mysqlPort: &mysqlPort 4002
    grpcPort: &grpcPort 4001
    httpPort: &httpPort 4000

greptimedb-standalone:
  fullnameOverride: *greptimeName
  postgresServicePort: *postgresPort
  mysqlServicePort: *mysqlPort
  grpcServicePort: *grpcPort
  httpServicePort: *httpPort
  extraVolumeMounts:
    - mountPath: /etc/greptimedb/auth
      name: auth
      readOnly: true
  extraVolumes:
    - name: auth
      secret:
        defaultMode: 420
        secretName: greptimedb-users-auth
  env:
    GREPTIMEDB_STANDALONE__USER_PROVIDER: "static_user_provider:file:/etc/greptimedb/auth/passwd"
  ## AWS start
  # objectStorage:
  #   s3:
  #     bucket: mdai-greptime-object-storage
  #     endpoint: s3.us-east-2.amazonaws.com
  #     region: us-east-2
  #     root: ""
  # persistence:
  #   storageClass: gp2
  #   size: 20Gi
  # serviceAccount:
  #   annotations:
  #     eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/mdai-greptime-irsa-role
  #   create: true
  #   name: greptimedb-standalone
## AWS end


kubeprometheusstack:
  prometheus:
    prometheusSpec:
      retention: 3h
      remoteRead:
        - url: 'http://{{ .Values.global.greptime.fullnameOverride | default "mdai-greptimedb" }}.{{ .Release.Namespace }}.svc.cluster.local:4000/v1/prometheus/read?db={{ .Values.global.greptime.databaseName | default "public" }}'
          basicAuth:
            username:
              name: greptimedb-users-auth
              key: GREPTIME_USER
            password:
              name: greptimedb-users-auth
              key: GREPTIME_PASSWD
          requiredMatchers:
            greptime_remote: "true"
      remoteWrite:
        - url: 'http://{{ .Values.global.greptime.fullnameOverride | default "mdai-greptimedb" }}.{{ .Release.Namespace }}.svc.cluster.local:4000/v1/prometheus/write?db={{ .Values.global.greptime.databaseName | default "public" }}'
          basicAuth:
            username:
              name: greptimedb-users-auth
              key: GREPTIME_USER
            password:
              name: greptimedb-users-auth
              key: GREPTIME_PASSWD
          writeRelabelConfigs:
            - sourceLabels: [ job, __name__ ]
              regex: '((mdai-observer-scrape|mdai-observer-otel-scrape|hub-monitor-scrape|otel-collector)|.*(-sampling-lb-collector|-trace-sampling-collector).*);.*|.*;(kube_pod_.*|container_.*|node_.*|kube_node_.*|process_.*)'
              action: keep
            - targetLabel: greptime_remote
              replacement: "true"
              action: replace

mdai-tracealyzer:
  replicaCount: 1

  image:
    repository: public.ecr.aws/decisiveai/mdai-tracealyzer
    pullPolicy: IfNotPresent
#    tag: "0.1.3"

  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: mdai-tracealyzer

  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""

  podAnnotations: {}
  podLabels: {}

  service:
    type: ClusterIP
    ports:
      otlpGrpc: 4317
      otlpHttp: 4318
      metrics: 9090

  serviceMonitor:
    enabled: true
    namespace: ""
    labels: {}
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: false
    relabelings: []
    metricRelabelings: []

  config:
    ingestion:
      otlpGrpcEndpoint: "0.0.0.0:4317"
      otlpHttpEndpoint: "0.0.0.0:4318"
    buffer:
      valkeyDb: 0
      quietPeriod: "60s"
      maxTtl: "10m"
      sweepInterval: "5s"
      # sweepWorkerPoolSize: 4  # defaults to runtime.NumCPU() when unset
    emitter:
      tableTtl: "14d"
      timeout: "10s"
      maxRetries: 5
      initialBackoff: "10s"
      batchSize: 100
      flushInterval: "1s"
      queueCapacity: 1000
    service:
      logLevel: "info"
      metricsEndpoint: "0.0.0.0:9090"
      shutdownGrace: "30s"

  secrets:
    valkeySecretName: "valkey-secret"
    greptimedbAuth:
      existingSecret: "greptimedb-users-auth"
      key: passwd

  migrationJob:
    enabled: true
    backoffLimit: 10
    ttlSecondsAfterFinished: 600
    annotations: {}

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  terminationGracePeriodSeconds: 30
